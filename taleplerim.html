<!DOCTYPE html>
<html lang="tr">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <title>Taleplerim - E-Tedarik</title>
        <link rel="stylesheet" href="css/panel.css">
        <link rel="icon" href="assets/tokalasma.png">
    </head>
    <body>
        <div class="mobil-ust-bar">
            <h1>E-Tedarik</h1>
            <button class="mobil-menu-btn" onclick="menuGoster()">&#9776;</button>
        </div>

        <div class="anaKapsayici">
            <div id="menuOverlay" class="menu-overlay" onclick="menuGoster()"></div>

            <div id="yanMenu" class="sideBar">
                <div class="sideBar-ust">
                    <div class="kullanici-bilgi">
                        <p style="font-size: 24px; font-weight: bold; letter-spacing: 1px; text-transform: uppercase; color: #e5cef8; margin: 0;">HOŞGELDİN <br><span id="kullaniciYeri" style="font-size: 18px;">'isim'</span></p>    
                    </div>
                    <div class="butonlar">
                        <button onclick="window.location.href='panel.html'" class="menuSekmeButonlari">Ana Panel</button>
                        <button onclick="window.location.href='taleplerim.html'" class="menuSekmeButonlari" style="background-color: #cab7f4;">Taleplerim</button>
                        <button onclick="window.location.href='tekliflerim.html'" class="menuSekmeButonlari">Tekliflerim</button>
                    </div>
                </div>
                <div class="sideBar-alt">
                    <button onclick="window.location.href='index.html'" class="menuSekmeButonlari cikis-btn">Çıkış Yap</button>
                </div>
            </div>

            <div class="icYapi">
                <div class="liste-kutusu">
                    <h2 style="color: #261543; margin-bottom: 15px;">Açtığım Talepler ve Gelen Teklifler</h2>
                    <table class="talep-tablosu">
                        <thead>
                            <tr>
                                <th>Talep Edilen Ürün</th>
                                <th>Miktar</th>
                                <th>Bitiş Tarihi</th>
                                <th>Durum</th>
                                <th>Gelen Teklif</th>
                                <th>İşlem</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>Bilgisayar Kasası</td>
                                <td>5 Adet</td>
                                <td>12.05.2026</td>
                                <td><span class="durum aktif">Yayında</span></td>
                                <td><strong>3</strong> Teklif</td>
                                <td><button class="btn-teklif" onclick="modalAc('Bilgisayar Kasası', 0)">Teklifleri İncele</button></td>
                            </tr>
                            <tr>
                                <td>Ofis Sandalyesi</td>
                                <td>10 Adet</td>
                                <td>01.05.2026</td>
                                <td><span class="durum kapali">Süresi Bitti</span></td>
                                <td><strong>5</strong> Teklif</td>
                                <td><button class="btn-teklif" onclick="modalAc('Ofis Sandalyesi', 1)">Teklifleri İncele</button></td>
                            </tr>
                            <tr id="dinamikTalepPlaceholder" style="display:none;"></tr>
                        </tbody>
                    </table>
                </div>
            </div>          
        </div>

        <div id="teklifModal" style="display:none; position:fixed; top:0; left:0; width:100vw; height:100vh; background:rgba(0,0,0,0.5); z-index:9999; justify-content:center; align-items:center;">
            <div style="background:#fff; border-radius:12px; padding:28px; width:92%; max-width:560px; position:relative; max-height:85vh; overflow-y:auto;">
                <button onclick="modalKapat()" style="position:absolute; top:12px; right:16px; background:none; border:none; font-size:22px; cursor:pointer;">✕</button>
                <h3 id="modalBaslik" style="color:#261543; margin-bottom:16px;"></h3>
                <table style="width:100%; border-collapse:collapse; font-size:14px;">
                    <thead>
                        <tr style="background:#f3eeff;">
                            <th style="padding:8px; text-align:left;">Firma</th>
                            <th style="padding:8px; text-align:left;">Fiyat</th>
                            <th style="padding:8px; text-align:left;">Tarih</th>
                            <th style="padding:8px; text-align:left;">Durum</th>
                            <th style="padding:8px; text-align:left;">İşlem</th>
                        </tr>
                    </thead>
                    <tbody id="modalTeklifler"></tbody>
                </table>
            </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <script src="js/taleplerim.js"></script>
        <script>
            function menuGoster() {
                document.getElementById('yanMenu').classList.toggle('acik');
                document.getElementById('menuOverlay').classList.toggle('acik');
            }
        </script>
    </body>
</html>
