<!DOCTYPE html>
<html lang="tr">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <title>E-Tedarik Paneli</title>
        <link rel="stylesheet" href="css/panel.css">
        <link rel="icon" href="assets/tokalasma.png">
    </head>
    <body>
        <div class="mobil-ust-bar">
            <h1>E-Tedarik</h1>
            <button class="mobil-menu-btn" onclick="menuGoster()">&#9776;</button>
        </div>

        <div class="anaKapsayici">
            <div id="menuOverlay" class="menu-overlay" onclick="menuGoster()"></div>

            <div id="yanMenu" class="sideBar">
                <div class="sideBar-ust">
                    <div class="kullanici-bilgi">
                        <p style="font-size: 24px; font-weight: bold; letter-spacing: 1px; text-transform: uppercase; color: #e5cef8; margin: 0;">HOŞGELDİN <br><span id="kullaniciYeri" style="font-size: 18px;">'isim'</span></p>    
                    </div>
                    <div class="butonlar">
                        <button onclick="window.location.href='panel.html'" class="menuSekmeButonlari" style="background-color: #cab7f4;">Ana Panel</button>
                        <button id="btnTaleplerim" onclick="window.location.href='taleplerim.html'" class="menuSekmeButonlari">Taleplerim</button>
                        <button id="btnTekliflerim" onclick="window.location.href='tekliflerim.html'" class="menuSekmeButonlari">Tekliflerim</button>
                    </div>
                </div>
                <div class="sideBar-alt">
                    <button onclick="window.location.href='index.html'" class="menuSekmeButonlari cikis-btn">Çıkış Yap</button>
                </div>
            </div>

            <div class="icYapi">
                <div class="talep-kutusu">
                    <h2 style="color: #261543; margin-bottom: 15px;">Yeni İhtiyaç Talebi Oluştur</h2>
                    <form class="talep-formu">
                        <input type="text" placeholder="Ürün Adı (Örn: A4 Kağıt)" required>
                        <input type="number" placeholder="Adet" required>
                        <select required>
                            <option value="">Birim Seç</option>
                            <option value="adet">Adet</option>
                            <option value="kg">Kg</option>
                            <option value="litre">Litre</option>
                        </select>
                        <input type="number" placeholder="Hedef Fiyat (TL)" required>
                        <input type="date" required title="Son Teklif Tarihi">
                        <button type="button" class="btn-gonder">Talebi Yayınla</button>
                        <div id="eklenenKalemlerAlani" style="margin-top: 18px;" class="eklenenler"></div>
                    </form>
                </div>

                <div class="liste-kutusu">
                    <h2 style="color: #261543; margin-bottom: 15px;">Piyasadaki Güncel Talepler</h2>
                    <table class="talep-tablosu">
                        <thead>
                            <tr>
                                <th>Firma</th>
                                <th>Ürün</th>
                                <th>Miktar</th>
                                <th>Fiyat</th>
                                <th>Son Tarih</th>
                                <th>İşlem</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>ABC Lojistik</td>
                                <td>Koli Bandı</td>
                                <td>500 Adet</td>
                                <td>7.500 TL</td>
                                <td>15.05.2026</td>
                                <td><button class="btn-teklif">Teklif Ver</button></td>
                            </tr>
                            <tr>
                                <td>XYZ Tekstil</td>
                                <td>Makine Yağı</td>
                                <td>50 Litre</td>    
                                <td>3.200 TL</td>
                                <td>18.05.2026</td>
                                <td><button class="btn-teklif">Teklif Ver</button></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>          
        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <script src="js/panel.js"></script>
        <script>
            function menuGoster() {
                document.getElementById('yanMenu').classList.toggle('acik');
                document.getElementById('menuOverlay').classList.toggle('acik');
            }
        </script>
    </body>
</html>
