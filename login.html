<!DOCTYPE html>
<html lang="tr">
    <head>
        <title>E-Tedarik Giriş</title>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="icon" type="image/png" href="assets/tokalasma.png">
        <!-- Bootstrap 5 CSS -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="css/login.css">
    </head>

    <body>
        <!-- Yükleniyor Ekranı -->
        <div id="yukleniyor-ekrani" class="loader-kapsayici">
            <div class="spinner"></div>
            <p style="margin-top: 20px; font-size: 18px; font-family: 'Trebuchet MS', Arial, sans-serif;">
                Sisteme giriş yapılıyor, lütfen bekleyin...
            </p>
        </div>

        <!-- Beyaz Kart -->
        <div class="login-kart">
            <a class="anaSayfaDonus" href="index.html">
                <h1>E-Tedarik</h1>
            </a>
            <h2>Sisteme Giriş</h2>
            <div class="alt-link">
                Hesabınız yok mu?
                <a href="sign.html">Kaydolun</a>
            </div>

            <!-- Hata / Başarı Mesajı -->
            <div id="mesajAlani"></div>

            <form id="loginFormu">
                <div class="form-grup">
                    <label for="eposta">E-posta:</label>
                    <input class="inputEposta" id="eposta" type="email" placeholder="example123@gmail.com" name="eposta" required>
                </div>
                <div class="form-grup">
                    <label for="sifre">Şifre:</label>
                    <input class="inputŞifre" type="password" id="sifre" name="sifre" required>
                </div>
                <div class="btn-giris-wrapper">
                    <button class="giris" id="giris" type="button">Giriş Yap</button>
                </div>
                <div class="sifre-unut">
                    <a href="#">Şifremi Unuttum</a>
                </div>
            </form>
        </div>

        <!-- Bootstrap 5 JS -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <script src="js/login.js"></script>
    </body>
</html>
